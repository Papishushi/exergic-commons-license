name: Living update integrity

on:
  push:
    paths:
      - "README.md"
      - "spec/LIVING-UPDATE-SYSTEM.md"
      - "spec/EVIDENCE-VALUATION.md"
      - "spec/KNOWLEDGE-MODEL.md"
      - "spec/VERSIONING.md"
      - "knowledge/**"
      - "dossiers/agencies/**"
      - "dossiers/organizations/**"
      - "dossiers/projects/**"
      - "reviews/2026/consistency/cross-entity-reconciliation.md"
      - "monitoring/**"
      - "ontology/**"
      - "schemas/**"
      - "channels/**"
      - "releases/**"
      - "sparql/**"
      - "examples/**"
      - "requirements-ontology.txt"
      - "tools/build_knowledge_graph.py"
      - "tools/check_canonical_entity_contract.py"
      - "tools/check_canonical_entity_contract_round6.py"
      - "tools/check_canonical_entity_contract_round6_impl.py"
      - "tools/canonical_dossier_contract.py"
      - "tools/canonical_dossier_contract_impl.py"
      - "tools/run_sparql_checks.py"
      - "tools/ecl_resolve.py"
      - "tools/update_ticket_sweep.py"
      - "tests/test_ecl_resolve.py"
      - "tests/test_update_ticket_sweep.py"
      - "tests/test_identity_only_dossier_governance_boundary.py"
      - "tests/test_cross_entity_claim_evidence_scaleout_v3.py"
      - "tests/test_state_project_track_claim_completeness.py"
      - "tests/test_agency_hierarchy_scaleout_v5.py"
      - "tests/test_canonical_entity_dossier_*.py"
      - ".github/workflows/living-update-integrity.yml"
      - ".github/workflows/living-review-sweep.yml"
  pull_request:
    paths:
      - "README.md"
      - "spec/LIVING-UPDATE-SYSTEM.md"
      - "spec/EVIDENCE-VALUATION.md"
      - "spec/KNOWLEDGE-MODEL.md"
      - "spec/VERSIONING.md"
      - "knowledge/**"
      - "dossiers/agencies/**"
      - "dossiers/organizations/**"
      - "dossiers/projects/**"
      - "reviews/2026/consistency/cross-entity-reconciliation.md"
      - "monitoring/**"
      - "ontology/**"
      - "schemas/**"
      - "channels/**"
      - "releases/**"
      - "sparql/**"
      - "examples/**"
      - "requirements-ontology.txt"
      - "tools/build_knowledge_graph.py"
      - "tools/check_canonical_entity_contract.py"
      - "tools/check_canonical_entity_contract_round6.py"
      - "tools/check_canonical_entity_contract_round6_impl.py"
      - "tools/canonical_dossier_contract.py"
      - "tools/canonical_dossier_contract_impl.py"
      - "tools/run_sparql_checks.py"
      - "tools/ecl_resolve.py"
      - "tools/update_ticket_sweep.py"
      - "tests/test_ecl_resolve.py"
      - "tests/test_update_ticket_sweep.py"
      - "tests/test_identity_only_dossier_governance_boundary.py"
      - "tests/test_cross_entity_claim_evidence_scaleout_v3.py"
      - "tests/test_state_project_track_claim_completeness.py"
      - "tests/test_agency_hierarchy_scaleout_v5.py"
      - "tests/test_canonical_entity_dossier_*.py"
      - ".github/workflows/living-update-integrity.yml"
      - ".github/workflows/living-review-sweep.yml"

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ontology.txt

      - name: Install RDF/SHACL tooling
        run: python -m pip install -r requirements-ontology.txt

      - name: Unit tests
        run: python -m unittest tests/test_update_ticket_sweep.py tests/test_ecl_resolve.py tests/test_identity_only_dossier_governance_boundary.py tests/test_cross_entity_claim_evidence_scaleout_v3.py tests/test_state_project_track_claim_completeness.py tests/test_agency_hierarchy_scaleout_v5.py

      - name: Parse structured JSON records
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          roots = [Path('knowledge'), Path('ontology'), Path('schemas'), Path('channels')]
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(root.rglob('*.json')) + sorted(root.rglob('*.jsonld')):
                  with path.open(encoding='utf-8') as handle:
                      json.load(handle)
                  print(f'validated JSON parse: {path}')
          PY

      - name: Validate canonical JSON-LD ABox dialect, placement and recursive schema surface
        run: python tools/check_canonical_entity_contract_round6.py --abox-only

      - name: Validate entity records against JSON Schema
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path('schemas/entity.schema.json').read_text(encoding='utf-8'))
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          paths = sorted(Path('knowledge/entities').rglob('*.json')) + sorted(Path('knowledge/entities').rglob('*.jsonld'))
          for path in paths:
              record = json.loads(path.read_text(encoding='utf-8'))
              errors = sorted(validator.iter_errors(record), key=lambda error: list(error.absolute_path))
              if errors:
                  details = '; '.join(error.message for error in errors)
                  raise SystemExit(f'{path}: entity schema validation failed: {details}')
              print(f'validated entity schema: {path}')
          PY

      - name: Parse OWL TBox and SHACL shapes
        run: |
          python - <<'PY'
          from rdflib import Graph
          for path in ('ontology/ecl.owl.ttl', 'ontology/ecl.shacl.ttl'):
              graph = Graph().parse(path, format='turtle')
              print(f'parsed {path}: {len(graph)} triples')
          PY

      - name: Build derived RDF dataset
        run: python tools/build_knowledge_graph.py --output-dir build

      - name: Validate ABox with OWL-RL plus SHACL
        run: pyshacl -s ontology/ecl.shacl.ttl -e ontology/ecl.owl.ttl -i owlrl build/ecl-abox.ttl

      - name: Run SPARQL integrity queries
        run: python tools/run_sparql_checks.py build/ecl-knowledge.ttl sparql/integrity

      - name: Dry-run review ticket sweep
        run: python tools/update_ticket_sweep.py knowledge/entities --today 2026-09-01 >/tmp/signals.json

      - name: Assert Japan pilot becomes due on 2026-09-01
        run: grep -q 'ECL-UPD-REVIEW-DUE-STATE-JPN-2026-09-01' /tmp/signals.json

      - name: Assert draft channel cannot resolve as stable
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ecl.toml <<'EOF'
          mode = "follow-stable"
          license = "1.x"
          schedule = "latest-compatible"
          channel = "draft"
          EOF
          if python tools/ecl_resolve.py /tmp/ecl.toml --output /tmp/ecl.lock; then
            echo "draft channel unexpectedly resolved as stable" >&2
            exit 1
          fi
